name: Release AddOn

# Runs whenever you push a tag (e.g. v1.0.0) - not on every regular commit
on:
  push:
    tags:
      - '**'
  # Manual run button on the repo's Actions tab. Needed because a tag pushed
  # in the SAME push that first adds this file can arrive before GitHub has
  # registered the workflow, so the release never fires and nothing reports an
  # error (hit on Xal's Reins' first push, 2026-08-19). With this, the release
  # can be started by hand against an existing tag instead of retagging.
  workflow_dispatch:

env:
  CF_API_KEY: ${{ secrets.CF_API_KEY }}
  # GITHUB_TOKEN is provided automatically by GitHub Actions - no need to create
  # your own secret for this one, just make sure the repo's Settings -> Actions
  # -> General -> Workflow permissions is set to "Read and write permissions"
  GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed so the packager can generate a changelog from commit history

      - uses: BigWigsMods/packager@v2

      # Announce the release in Discord: posts the latest CHANGELOG.md entry to a
      # webhook (clean, player-facing - no filenames). No-ops safely if the
      # DISCORD_WEBHOOK_URL secret isn't set, so it never breaks a release.
      - name: Announce on Discord
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/discord_changelog.py
